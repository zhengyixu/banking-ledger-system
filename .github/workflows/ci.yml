name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger_test
      TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Audit locked dependencies (pip-audit)
        # Audits exactly what uv.lock pins (all groups), with hashes; pip is never invoked.
        run: |
          uv export --quiet --frozen --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx --python 3.12 pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip

      - name: Tests
        run: uv run pytest -q

      - name: Build Docker image
        run: docker build -t ledger-service .
