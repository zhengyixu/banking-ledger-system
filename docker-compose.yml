services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      # 5455 on the host so we don't collide with other projects' Postgres
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # scripts here run once, on first start of an empty volume
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/ledger
  app:
    build: .
    ports: ["8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/ledger

volumes:
  pgdata:
